<meta name="hz:canvas-width" content="1080">
<meta name="hz:canvas-height" content="1920">
<style>
  html,body{margin:0;padding:0;background:#000;}
  .slide{width:1080px;height:1920px;position:relative;overflow:hidden;}
  svg{display:block;width:1080px;height:1920px;}

  /* ---- master timeline: 10s ---- */
  .anim{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.45,.05,.35,1);}

  #gm       {animation-name:gmMove;}
  #gmTorso  {animation-name:gmLean;   transform-origin:400px 1310px;}
  #gmThigh  {animation-name:gmThigh;  transform-origin:400px 1310px;}
  #gmShin   {animation-name:gmShin;   transform-origin:570px 1316px;}
  #gmArmA   {animation-name:gmArmA;   transform-origin:432px 1120px;}
  #gmArmB   {animation-name:gmArmB;   transform-origin:388px 1124px;}
  #gmThumb  {animation-name:thumbPop; transform-origin:512px 1244px;}

  #cg       {animation-name:cgMove;}
  #cgTorso  {animation-name:cgLean;   transform-origin:250px 1170px;}
  #cgArmFar {animation-name:cgArmFar; transform-origin:222px 1000px;}
  #cgArmNear{animation-name:cgArmNear;transform-origin:286px 1004px;}
  #cgLegF   {animation-name:cgLegF;   transform-origin:250px 1170px;}
  #cgLegB   {animation-name:cgLegB;   transform-origin:250px 1170px;}

  /* grandma: sit -> rise -> travel right -> sit into wheelchair */
  @keyframes gmMove{
     0%,15%   {transform:translate(0px,0px);}
     30%      {transform:translate(4px,-10px);}
     55%      {transform:translate(70px,-140px);}
     75%      {transform:translate(388px,-134px);}
     90%,100% {transform:translate(400px,36px);}
  }
  @keyframes gmLean{
     0%,15%   {transform:rotate(0deg);}
     30%      {transform:rotate(9deg);}
     55%      {transform:rotate(3deg);}
     75%      {transform:rotate(2deg);}
     90%,100% {transform:rotate(0deg);}
  }
  @keyframes gmThigh{
     0%,15%   {transform:rotate(0deg);}
     30%      {transform:rotate(4deg);}
     55%      {transform:rotate(84deg);}
     75%      {transform:rotate(84deg);}
     90%,100% {transform:rotate(0deg);}
  }
  @keyframes gmShin{
     0%,15%   {transform:rotate(0deg);}
     30%      {transform:rotate(-6deg);}
     55%      {transform:rotate(-84deg);}
     75%      {transform:rotate(-84deg);}
     90%,100% {transform:rotate(0deg);}
  }
  /* grandma's near arm rests on caregiver's forearm, then rises into a thumbs-up
     out to her right — clear of her face */
  @keyframes gmArmA{
     0%,12%   {transform:rotate(0deg);}
     30%,75%  {transform:rotate(-26deg);}
     88%      {transform:rotate(-18deg);}
     94%,100% {transform:rotate(-72deg);}
  }
  @keyframes gmArmB{
     0%,12%   {transform:rotate(0deg);}
     30%,75%  {transform:rotate(20deg);}
     90%,100% {transform:rotate(4deg);}
  }
  /* counter-rotates so the thumb points straight up in world space */
  @keyframes thumbPop{
     0%,90%   {opacity:0; transform:rotate(0deg);}
     94%      {opacity:1; transform:rotate(72deg);}
     100%     {opacity:1; transform:rotate(72deg);}
  }

  /* caregiver: step in, support, travel right with her */
  @keyframes cgMove{
     0%      {transform:translate(-70px,0px);}
     15%     {transform:translate(0px,0px);}
     30%     {transform:translate(14px,0px);}
     55%     {transform:translate(74px,0px);}
     75%     {transform:translate(330px,0px);}
     90%,100%{transform:translate(346px,0px);}
  }
  @keyframes cgLean{
     0%      {transform:rotate(0deg);}
     15%     {transform:rotate(4deg);}
     30%     {transform:rotate(12deg);}
     55%     {transform:rotate(5deg);}
     75%     {transform:rotate(4deg);}
     90%,100%{transform:rotate(0deg);}
  }
  /* base geometry IS the support pose; positive rotation swings the arm down */
  @keyframes cgArmFar{
     0%      {transform:rotate(32deg);}
     15%     {transform:rotate(11deg);}
     30%,75% {transform:rotate(0deg);}
     90%,100%{transform:rotate(38deg);}
  }
  @keyframes cgArmNear{
     0%      {transform:rotate(34deg);}
     15%     {transform:rotate(12deg);}
     30%,75% {transform:rotate(0deg);}
     90%,100%{transform:rotate(42deg);}
  }
  @keyframes cgLegF{
     0%      {transform:rotate(-6deg);}
     15%,55% {transform:rotate(4deg);}
     62%     {transform:rotate(-9deg);}
     75%,100%{transform:rotate(3deg);}
  }
  @keyframes cgLegB{
     0%      {transform:rotate(7deg);}
     15%,55% {transform:rotate(-3deg);}
     62%     {transform:rotate(10deg);}
     75%,100%{transform:rotate(-2deg);}
  }

  /* ambient */
  #curtain{animation:sway 6s ease-in-out infinite;transform-origin:470px 300px;}
  @keyframes sway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(1.4deg)}}
</style>

<div class="slide">

        <circle cx="486" cy="1240" r="7"/><circle cx="424" cy="1180" r="6"/>

      <!-- 頭 -->
